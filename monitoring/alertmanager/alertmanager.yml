#
# Aruanda D1 — lab default: null sink (no webhook).
# Alerts are visible in the Alertmanager UI (:9093); nothing is delivered externally.
# To wire a real sink later, add webhook_configs.url from env/ops (never commit secrets).

global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: ['alertname', 'job']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h

receivers:
  # Empty receiver = null sink (alerts stay in AM UI / silences only).
  - name: default
