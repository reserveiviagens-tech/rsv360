name: route-smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'apps/**'
      - 'backend/**'
      - 'docker-compose.yml'
      - 'tests/e2e/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/route-smoke.yml'
  workflow_dispatch:

jobs:
  route-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      POSTGRES_USER: rsv360
      POSTGRES_PASSWORD: REDACTED_PG_DEV_PASSWORD
      POSTGRES_DB: rsv_360_ecosystem
      # docker-compose.yml mapeia postgres 5433:5432 (evita conflito local); no runner CI usar 5433.
      DATABASE_URL: postgresql://rsv360:REDACTED_PG_DEV_PASSWORD@localhost:5433/rsv_360_ecosystem
      JWT_SECRET: ci_route_smoke_jwt_secret_minimum_32_chars
      SEED_TEST_USER_EMAIL: test@local.dev
      SEED_TEST_USER_PASSWORD: dev-only-fallback-do-not-use-in-prod
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare npm@10.9.7 --activate

      - name: Validate lockfiles
        run: bash .github/scripts/check-lockfiles.sh . backend

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (Chromium only)
        run: npx playwright install --with-deps chromium

      - name: Start database services
        run: docker compose up -d postgres redis

      - name: Wait for database
        run: |
          until docker compose exec -T postgres pg_isready -U rsv360 -d rsv_360_ecosystem; do
            sleep 5
          done

      - name: Reject UTF-8 BOM in Drizzle SQL
        run: bash .github/scripts/check-sql-bom.sh backend/drizzle

      - name: Run database migrations
        working-directory: backend
        run: npm run migrate

      - name: Ensure auth v1 tables (rate limit + refresh tokens)
        run: |
          cat database/g4-auth-smoke-tables.sql | docker compose exec -T postgres psql -U rsv360 -d rsv_360_ecosystem
          cat apps/site-publico/scripts/create-refresh-tokens-tables.sql | docker compose exec -T postgres psql -U rsv360 -d rsv_360_ecosystem

      - name: Seed deterministic test user
        working-directory: backend
        env:
          SEED_TEST_USER_ROLE: admin
        run: npm run seed

      - name: Run portal booking read smoke
        working-directory: backend
        env:
          PORTAL_SMOKE_BOOKING_CODE: SEED-ACC-001
        run: npm run smoke:portal-booking

      - name: Run portal booking write smoke
        working-directory: backend
        env:
          PORTAL_SMOKE_BOOKING_CODE: SEED-ACC-001
        run: npx tsx ../server/modules/guest-portal/portal-booking-write.smoke.ts

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Build & start Docker stack
        run: |
          set -e
          for svc in backend site-publico admin turismo guest; do
            docker compose build "$svc"
            docker system prune -f
          done
          docker compose up -d --wait --wait-timeout 600 backend site-publico admin turismo guest

      - name: Wait for services (URL readiness)
        run: |
          urls=(
            "http://localhost:3002/health"
            "http://localhost:3000/lab"
            "http://localhost:3004/"
            "http://localhost:3005/api/health"
            "http://localhost:3006/"
          )
          deadline=$((SECONDS + 300))
          for url in "${urls[@]}"; do
            echo "Waiting for $url ..."
            while ! curl -fsS --max-time 5 "$url" > /dev/null; do
              if [ $SECONDS -gt $deadline ]; then
                echo "Timeout waiting for $url" >&2
                docker compose ps
                exit 1
              fi
              sleep 5
            done
            echo "OK: $url"
          done

      - name: Reset auth rate limits before E2E
        run: |
          docker compose exec -T postgres psql -U rsv360 -d rsv_360_ecosystem -c "DELETE FROM auth_rate_limits;" || true

      - name: Wait for backend auth API (not 503)
        run: |
          deadline=$((SECONDS + 120))
          while true; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:3002/api/v1/auth/login \
              -H 'Content-Type: application/json' \
              -d '{"email":"test@local.dev","password":"probe-wrong-password"}' || echo "000")
            if [ "$code" = "401" ] || [ "$code" = "200" ] || [ "$code" = "429" ]; then
              echo "Backend auth ready (HTTP $code)"
              break
            fi
            if [ $SECONDS -gt $deadline ]; then
              echo "Timeout waiting for auth API (last HTTP $code)" >&2
              docker compose logs backend --tail 40
              exit 1
            fi
            echo "Auth not ready (HTTP $code), retrying..."
            sleep 5
          done

      - name: Run auth v1 E2E (T1.9 — cenários #31)
        env:
          RSV_AUTH_V1_BACKEND_URL: http://localhost:3002
        run: npm run test:e2e:auth-v1

      - name: Run turismo legacy auth smoke (D2.1)
        env:
          RSV_AUTH_V1_BACKEND_URL: http://localhost:3002
          RSV_SMOKE_TURISMO_URL: http://localhost:3005
        run: npm run test:e2e:turismo-legacy

      - name: Run guest E2E smoke (Phase 7-G.2)
        working-directory: apps/guest
        env:
          GUEST_BASE_URL: http://localhost:3006
          PORTAL_TEST_BOOKING_CODE: SEED-ACC-001
          PORTAL_TEST_PATH: /reservations
        run: npx playwright test --reporter=list

      - name: Run marketing lab smoke (Fase 3 coexistência)
        env:
          RSV_SMOKE_SITE_PUBLICO_URL: http://localhost:3000
          RSV_SMOKE_PRIMARY_SITE_URL: http://localhost:5000
          RSV_SMOKE_MARKETING_LAB: "true"
        run: npm run smoke:marketing-lab

      - name: Run route smoke
        env:
          RSV_SMOKE_SITE_PUBLICO_URL: http://localhost:3000
          RSV_SMOKE_ADMIN_URL: http://localhost:3004
          RSV_SMOKE_TURISMO_URL: http://localhost:3005
          RSV_SMOKE_GUEST_URL: http://localhost:3006
          RSV360_APP_MODE: marketing-lab
          NEXT_PUBLIC_APP_MODE: marketing-lab
        run: npm run test:e2e:routes

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: route-smoke-artifacts
          path: tests/e2e/artifacts/**
          if-no-files-found: warn
          retention-days: 14

      - name: Dump compose ps on failure
        if: failure()
        run: docker compose ps > compose-ps.txt || true

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs --no-color > compose-logs.txt || true

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: compose-failure-logs
          path: |
            compose-ps.txt
            compose-logs.txt
          if-no-files-found: ignore
