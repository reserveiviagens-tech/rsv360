# C36-CN — Controlled staging earning probe (namespace c36cn_*)
# confirm = VALIDATE_EARNING_C36CN
name: C36 Staging Earning Validate

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type exactly VALIDATE_EARNING_C36CN"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: c36-staging-earning-validate
  cancel-in-progress: false

jobs:
  validate:
    name: Staging earning flow c36cn
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    if: ${{ inputs.confirm == 'VALIDATE_EARNING_C36CN' }}
    steps:
      - name: Confirm gate
        run: echo "C36-CN staging earning validation"

      - name: SSH seed + probe + cleanup
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT || 22 }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd "${{ secrets.STAGING_PATH }}"
            if [ -f .env ]; then set -a; . <(sed 's/\r$//' .env); set +a; fi
            : "${POSTGRES_USER:?}"; : "${POSTGRES_DB:?}"
            COMPOSE="docker compose -f docker-compose.staging.yml"
            NS="c36cn_$(date +%s)"
            echo "NAMESPACE=$NS"
            trim_id() { printf '%s' "$1" | tr -d '\r' | awk 'NF { print; exit }'; }

            TIP=$(trim_id "$($COMPOSE exec -T postgres psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -Atc "SELECT COUNT(*) FROM drizzle.__drizzle_migrations;")")
            echo "MIGRATION_ROWS=$TIP"
            HAS_TERMS=$(trim_id "$($COMPOSE exec -T postgres psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -Atc "SELECT CASE WHEN to_regclass('public.partner_commercial_terms') IS NULL THEN 0 ELSE 1 END;")")
            echo "HAS_TERMS=$HAS_TERMS"
            test "$HAS_TERMS" = "1"

            UID1=$(trim_id "$($COMPOSE exec -T postgres psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -Atc "SELECT id::text FROM users ORDER BY id LIMIT 1;")")
            if [ -z "$UID1" ]; then
              echo "No users row - seeding c36cn fixture user"
              UID1=$(trim_id "$($COMPOSE exec -T postgres psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -Atc "INSERT INTO users (name, email, password, role, is_active) VALUES ('c36cn', '${NS}@example.invalid', 'x', 'admin', true) RETURNING id::text;")")
            fi
            echo "UID1=$UID1"
            test -n "$UID1"
            ENT=$(trim_id "$($COMPOSE exec -T postgres psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -Atc "SELECT gen_random_uuid()::text;")")
            echo "ENT=$ENT"

            echo "=== SEED A ==="
            EID_A=$(trim_id "$($COMPOSE exec -T postgres psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -Atc "INSERT INTO empreendimentos (slug, hotel_id, nome_oficial, nome_normalizado, metadata) VALUES ('${NS}-a', '${NS}-h-a', '${NS} a', '${NS} a', jsonb_build_object('c36cn', true, 'ns', '${NS}')) RETURNING id::text;")")
            ACO_A=$(trim_id "$($COMPOSE exec -T postgres psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -Atc "INSERT INTO acomodacoes (hotel_id, titulo, capacidade_max, ativo) VALUES ('${NS}-h-a', '${NS} unit a', 2, true) RETURNING id::text;")")
            PID_A=$(trim_id "$($COMPOSE exec -T postgres psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -Atc "INSERT INTO partners (id, code, display_name, status, metadata, created_at, updated_at) VALUES (gen_random_uuid(), left('${NS}_pa', 64), '${NS}_pa', 'active', jsonb_build_object('c36cn', true, 'ns', '${NS}'), now(), now()) RETURNING id::text;")")
            PEA_A=$(trim_id "$($COMPOSE exec -T postgres psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -Atc "INSERT INTO partner_empreendimento_associations (id, partner_id, empreendimento_id, association_role, status, metadata, created_at, updated_at) VALUES (gen_random_uuid(), '${PID_A}'::uuid, ${EID_A}::int, 'commercial_owner', 'active', jsonb_build_object('c36cn', true, 'ns', '${NS}'), now(), now()) RETURNING id::text;")")
            $COMPOSE exec -T postgres psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -v ON_ERROR_STOP=1 -c "INSERT INTO partner_commercial_terms (pea_id, rate_kind, rate_bps, basis, status, version) VALUES ('${PEA_A}'::uuid, 'percent_bps', 1500, 'booking_total', 'active', 1);"
            BID_A=$(trim_id "$($COMPOSE exec -T postgres psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -Atc "INSERT INTO bookings (booking_code, booking_type, item_id, item_name, user_id, customer_name, customer_email, start_date, end_date, total_amount, currency, payment_method, payment_status, status, metadata) VALUES (left('${NS}_a', 50), 'accommodation', ${ACO_A}::int, 'c36cn unit', ${UID1}::int, 'C36CN Tester', 'c36cn@example.invalid', now(), now() + interval '2 days', '1000.00', 'BRL', 'pix', 'paid', 'confirmed', jsonb_build_object('c36cn', true, 'ns', '${NS}')) RETURNING id::text;")")
            PAY_A=$(trim_id "$($COMPOSE exec -T postgres psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -Atc "INSERT INTO payments (id, enterprise_id, provider, method, status, amount, currency, booking_id, paid_at, metadata, created_at, updated_at) VALUES (gen_random_uuid(), '${ENT}'::uuid, 'mercadopago', 'pix', 'approved', '1000.00', 'BRL', ${BID_A}::int, now(), jsonb_build_object('c36cn', true, 'ns', '${NS}'), now(), now()) RETURNING id::text;")")
            echo "A eid=$EID_A pea=$PEA_A pay=$PAY_A"

            echo "=== SEED C agency only ==="
            EID_C=$(trim_id "$($COMPOSE exec -T postgres psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -Atc "INSERT INTO empreendimentos (slug, hotel_id, nome_oficial, nome_normalizado, metadata) VALUES ('${NS}-c', '${NS}-h-c', '${NS} c', '${NS} c', jsonb_build_object('c36cn', true, 'ns', '${NS}')) RETURNING id::text;")")
            ACO_C=$(trim_id "$($COMPOSE exec -T postgres psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -Atc "INSERT INTO acomodacoes (hotel_id, titulo, capacidade_max, ativo) VALUES ('${NS}-h-c', '${NS} unit c', 2, true) RETURNING id::text;")")
            PID_C=$(trim_id "$($COMPOSE exec -T postgres psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -Atc "INSERT INTO partners (id, code, display_name, status, metadata, created_at, updated_at) VALUES (gen_random_uuid(), left('${NS}_pc', 64), '${NS}_pc', 'active', jsonb_build_object('c36cn', true, 'ns', '${NS}'), now(), now()) RETURNING id::text;")")
            $COMPOSE exec -T postgres psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -v ON_ERROR_STOP=1 -c "INSERT INTO partner_empreendimento_associations (id, partner_id, empreendimento_id, association_role, status, metadata, created_at, updated_at) VALUES (gen_random_uuid(), '${PID_C}'::uuid, ${EID_C}::int, 'agency', 'active', jsonb_build_object('c36cn', true, 'ns', '${NS}'), now(), now());"
            BID_C=$(trim_id "$($COMPOSE exec -T postgres psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -Atc "INSERT INTO bookings (booking_code, booking_type, item_id, item_name, user_id, customer_name, customer_email, start_date, end_date, total_amount, currency, payment_method, payment_status, status, metadata) VALUES (left('${NS}_c', 50), 'accommodation', ${ACO_C}::int, 'c36cn unit', ${UID1}::int, 'C36CN Tester', 'c36cn@example.invalid', now(), now() + interval '2 days', '1000.00', 'BRL', 'pix', 'paid', 'confirmed', jsonb_build_object('c36cn', true, 'ns', '${NS}')) RETURNING id::text;")")
            PAY_C=$(trim_id "$($COMPOSE exec -T postgres psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -Atc "INSERT INTO payments (id, enterprise_id, provider, method, status, amount, currency, booking_id, paid_at, metadata, created_at, updated_at) VALUES (gen_random_uuid(), '${ENT}'::uuid, 'mercadopago', 'pix', 'approved', '1000.00', 'BRL', ${BID_C}::int, now(), jsonb_build_object('c36cn', true, 'ns', '${NS}'), now(), now()) RETURNING id::text;")")

            echo "=== SEED D two owners ==="
            EID_D=$(trim_id "$($COMPOSE exec -T postgres psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -Atc "INSERT INTO empreendimentos (slug, hotel_id, nome_oficial, nome_normalizado, metadata) VALUES ('${NS}-d', '${NS}-h-d', '${NS} d', '${NS} d', jsonb_build_object('c36cn', true, 'ns', '${NS}')) RETURNING id::text;")")
            ACO_D=$(trim_id "$($COMPOSE exec -T postgres psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -Atc "INSERT INTO acomodacoes (hotel_id, titulo, capacidade_max, ativo) VALUES ('${NS}-h-d', '${NS} unit d', 2, true) RETURNING id::text;")")
            PID_D1=$(trim_id "$($COMPOSE exec -T postgres psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -Atc "INSERT INTO partners (id, code, display_name, status, metadata, created_at, updated_at) VALUES (gen_random_uuid(), left('${NS}_pd1', 64), '${NS}_pd1', 'active', jsonb_build_object('c36cn', true, 'ns', '${NS}'), now(), now()) RETURNING id::text;")")
            PID_D2=$(trim_id "$($COMPOSE exec -T postgres psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -Atc "INSERT INTO partners (id, code, display_name, status, metadata, created_at, updated_at) VALUES (gen_random_uuid(), left('${NS}_pd2', 64), '${NS}_pd2', 'active', jsonb_build_object('c36cn', true, 'ns', '${NS}'), now(), now()) RETURNING id::text;")")
            $COMPOSE exec -T postgres psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -v ON_ERROR_STOP=1 -c "INSERT INTO partner_empreendimento_associations (id, partner_id, empreendimento_id, association_role, status, metadata, created_at, updated_at) VALUES (gen_random_uuid(), '${PID_D1}'::uuid, ${EID_D}::int, 'commercial_owner', 'active', jsonb_build_object('c36cn', true, 'ns', '${NS}'), now(), now());"
            $COMPOSE exec -T postgres psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -v ON_ERROR_STOP=1 -c "INSERT INTO partner_empreendimento_associations (id, partner_id, empreendimento_id, association_role, status, metadata, created_at, updated_at) VALUES (gen_random_uuid(), '${PID_D2}'::uuid, ${EID_D}::int, 'commercial_owner', 'active', jsonb_build_object('c36cn', true, 'ns', '${NS}'), now(), now());"
            BID_D=$(trim_id "$($COMPOSE exec -T postgres psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -Atc "INSERT INTO bookings (booking_code, booking_type, item_id, item_name, user_id, customer_name, customer_email, start_date, end_date, total_amount, currency, payment_method, payment_status, status, metadata) VALUES (left('${NS}_d', 50), 'accommodation', ${ACO_D}::int, 'c36cn unit', ${UID1}::int, 'C36CN Tester', 'c36cn@example.invalid', now(), now() + interval '2 days', '1000.00', 'BRL', 'pix', 'paid', 'confirmed', jsonb_build_object('c36cn', true, 'ns', '${NS}')) RETURNING id::text;")")
            PAY_D=$(trim_id "$($COMPOSE exec -T postgres psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -Atc "INSERT INTO payments (id, enterprise_id, provider, method, status, amount, currency, booking_id, paid_at, metadata, created_at, updated_at) VALUES (gen_random_uuid(), '${ENT}'::uuid, 'mercadopago', 'pix', 'approved', '1000.00', 'BRL', ${BID_D}::int, now(), jsonb_build_object('c36cn', true, 'ns', '${NS}'), now(), now()) RETURNING id::text;")")

            echo "=== SEED E owner no terms ==="
            EID_E=$(trim_id "$($COMPOSE exec -T postgres psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -Atc "INSERT INTO empreendimentos (slug, hotel_id, nome_oficial, nome_normalizado, metadata) VALUES ('${NS}-e', '${NS}-h-e', '${NS} e', '${NS} e', jsonb_build_object('c36cn', true, 'ns', '${NS}')) RETURNING id::text;")")
            ACO_E=$(trim_id "$($COMPOSE exec -T postgres psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -Atc "INSERT INTO acomodacoes (hotel_id, titulo, capacidade_max, ativo) VALUES ('${NS}-h-e', '${NS} unit e', 2, true) RETURNING id::text;")")
            PID_E=$(trim_id "$($COMPOSE exec -T postgres psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -Atc "INSERT INTO partners (id, code, display_name, status, metadata, created_at, updated_at) VALUES (gen_random_uuid(), left('${NS}_pe', 64), '${NS}_pe', 'active', jsonb_build_object('c36cn', true, 'ns', '${NS}'), now(), now()) RETURNING id::text;")")
            $COMPOSE exec -T postgres psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -v ON_ERROR_STOP=1 -c "INSERT INTO partner_empreendimento_associations (id, partner_id, empreendimento_id, association_role, status, metadata, created_at, updated_at) VALUES (gen_random_uuid(), '${PID_E}'::uuid, ${EID_E}::int, 'commercial_owner', 'active', jsonb_build_object('c36cn', true, 'ns', '${NS}'), now(), now());"
            BID_E=$(trim_id "$($COMPOSE exec -T postgres psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -Atc "INSERT INTO bookings (booking_code, booking_type, item_id, item_name, user_id, customer_name, customer_email, start_date, end_date, total_amount, currency, payment_method, payment_status, status, metadata) VALUES (left('${NS}_e', 50), 'accommodation', ${ACO_E}::int, 'c36cn unit', ${UID1}::int, 'C36CN Tester', 'c36cn@example.invalid', now(), now() + interval '2 days', '1000.00', 'BRL', 'pix', 'paid', 'confirmed', jsonb_build_object('c36cn', true, 'ns', '${NS}')) RETURNING id::text;")")
            PAY_E=$(trim_id "$($COMPOSE exec -T postgres psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -Atc "INSERT INTO payments (id, enterprise_id, provider, method, status, amount, currency, booking_id, paid_at, metadata, created_at, updated_at) VALUES (gen_random_uuid(), '${ENT}'::uuid, 'mercadopago', 'pix', 'approved', '1000.00', 'BRL', ${BID_E}::int, now(), jsonb_build_object('c36cn', true, 'ns', '${NS}'), now(), now()) RETURNING id::text;")")

            echo "=== RUN PROBE ==="
            $COMPOSE exec -T -e C36CN_NS="$NS" -e C36CN_PAYMENT_A="$PAY_A" -e C36CN_PAYMENT_C="$PAY_C" -e C36CN_PAYMENT_D="$PAY_D" -e C36CN_PAYMENT_E="$PAY_E" backend npx tsx /workspace/backend/scripts/c36cn-earning-probe.ts

            echo "=== CLEANUP ==="
            $COMPOSE exec -T postgres psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -v ON_ERROR_STOP=1 -c "DELETE FROM partner_earnings pe USING payments p WHERE pe.source_id = p.id::text AND p.metadata->>'ns' = '${NS}';"
            $COMPOSE exec -T postgres psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -v ON_ERROR_STOP=1 -c "DELETE FROM payments WHERE metadata->>'ns' = '${NS}';"
            $COMPOSE exec -T postgres psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -v ON_ERROR_STOP=1 -c "DELETE FROM bookings WHERE metadata->>'ns' = '${NS}';"
            $COMPOSE exec -T postgres psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -v ON_ERROR_STOP=1 -c "DELETE FROM partner_commercial_terms pct USING partner_empreendimento_associations pea WHERE pct.pea_id = pea.id AND pea.metadata->>'ns' = '${NS}';"
            $COMPOSE exec -T postgres psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -v ON_ERROR_STOP=1 -c "DELETE FROM partner_empreendimento_associations WHERE metadata->>'ns' = '${NS}';"
            $COMPOSE exec -T postgres psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -v ON_ERROR_STOP=1 -c "DELETE FROM partners WHERE metadata->>'ns' = '${NS}';"
            $COMPOSE exec -T postgres psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -v ON_ERROR_STOP=1 -c "DELETE FROM acomodacoes WHERE hotel_id LIKE '${NS}-h-%';"
            $COMPOSE exec -T postgres psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -v ON_ERROR_STOP=1 -c "DELETE FROM empreendimentos WHERE metadata->>'ns' = '${NS}';"
            $COMPOSE exec -T postgres psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -v ON_ERROR_STOP=1 -c "DELETE FROM users WHERE email = '${NS}@example.invalid';"
            LEFT=$(trim_id "$($COMPOSE exec -T postgres psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -Atc "SELECT (SELECT COUNT(*) FROM partners WHERE metadata->>'ns'='${NS}') + (SELECT COUNT(*) FROM empreendimentos WHERE metadata->>'ns'='${NS}') + (SELECT COUNT(*) FROM payments WHERE metadata->>'ns'='${NS}');")")
            test "$LEFT" = "0"
            echo "C36-CN VALIDATE = SUCCESS residual=0"
