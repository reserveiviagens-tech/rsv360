# C36-CN — Controlled staging earning probe (namespace c36cn_*)
# confirm = VALIDATE_EARNING_C36CN
# Requires: migration tip 0061; backend image with C36-CL/CM code.
name: C36 Staging Earning Validate

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type exactly VALIDATE_EARNING_C36CN"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: c36-staging-earning-validate
  cancel-in-progress: false

jobs:
  validate:
    name: Staging earning flow c36cn
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    if: ${{ inputs.confirm == 'VALIDATE_EARNING_C36CN' }}
    steps:
      - name: Confirm gate
        run: echo "C36-CN staging earning validation"

      - name: SSH seed + probe + cleanup
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT || 22 }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd "${{ secrets.STAGING_PATH }}"
            if [ -f .env ]; then set -a; . <(sed 's/\r$//' .env); set +a; fi
            : "${POSTGRES_USER:?}"; : "${POSTGRES_DB:?}"
            COMPOSE="docker compose -f docker-compose.staging.yml"
            NS="c36cn_$(date +%s)"
            echo "NAMESPACE=$NS"
            trim_id() { printf '%s' "$1" | tr -d '\r' | awk 'NF { print; exit }'; }

            TIP=$(trim_id "$($COMPOSE exec -T postgres psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -Atc \
              "SELECT COUNT(*) FROM drizzle.__drizzle_migrations;")")
            echo "MIGRATION_ROWS=$TIP"
            HAS_TERMS=$(trim_id "$($COMPOSE exec -T postgres psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -Atc \
              "SELECT CASE WHEN to_regclass('public.partner_commercial_terms') IS NULL THEN 0 ELSE 1 END;")")
            echo "HAS_TERMS=$HAS_TERMS"
            test "$HAS_TERMS" = "1"

            UID1=$(trim_id "$($COMPOSE exec -T postgres psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -Atc \
              "SELECT id::text FROM users ORDER BY id LIMIT 1;")")
            if [ -z "$UID1" ]; then
              echo "No users row - seeding c36cn fixture user"
              UID1=$(trim_id "$($COMPOSE exec -T postgres psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -Atc \
                "INSERT INTO users (name, email, password, role, is_active)
                 VALUES ('c36cn', '${NS}@example.invalid', 'x', 'admin', true)
                 RETURNING id::text;")")
            fi
            echo "UID1=$UID1"
            test -n "$UID1"
            ENT=$(trim_id "$($COMPOSE exec -T postgres psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -Atc \
              "SELECT gen_random_uuid()::text;")")
            echo "ENT=$ENT"

            seed_emp_aco() {
              local suffix="$1"
              local hotel="${NS}-h-${suffix}"
              local eid acid
              eid=$(trim_id "$($COMPOSE exec -T postgres psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -Atc \
                "INSERT INTO empreendimentos (slug, hotel_id, nome_oficial, nome_normalizado, metadata)
                 VALUES ('${NS}-${suffix}', '${hotel}', '${NS} ${suffix}', '${NS} ${suffix}',
                         jsonb_build_object('c36cn', true, 'ns', '${NS}', 'case', '${suffix}'))
                 RETURNING id::text;")")
              acid=$(trim_id "$($COMPOSE exec -T postgres psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -Atc \
                "INSERT INTO acomodacoes (hotel_id, titulo, capacidade_max, ativo)
                 VALUES ('${hotel}', '${NS} unit ${suffix}', 2, true)
                 RETURNING id::text;")")
              echo "$eid $acid $hotel"
            }

            seed_partner() {
              local code="$1"
              local out
              out=$(trim_id "$($COMPOSE exec -T postgres psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -Atc \
                "INSERT INTO partners (id, code, display_name, status, metadata, created_at, updated_at)
                 VALUES (gen_random_uuid(), left('${code}', 64), '${code}', 'active',
                         jsonb_build_object('c36cn', true, 'ns', '${NS}'), now(), now())
                 RETURNING id::text;")")
              echo "$out"
            }

            seed_pea() {
              local pid="$1" eid="$2" role="$3"
              local out
              out=$(trim_id "$($COMPOSE exec -T postgres psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -Atc \
                "INSERT INTO partner_empreendimento_associations
                   (id, partner_id, empreendimento_id, association_role, status, metadata, created_at, updated_at)
                 VALUES (gen_random_uuid(), '$pid'::uuid, $eid::int, '$role', 'active',
                         jsonb_build_object('c36cn', true, 'ns', '${NS}'), now(), now())
                 RETURNING id::text;")")
              echo "$out"
            }

            seed_booking_payment() {
              local acid="$1" label="$2"
              local bid pay
              bid=$(trim_id "$($COMPOSE exec -T postgres psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -Atc \
                "INSERT INTO bookings (
                   booking_code, booking_type, item_id, item_name, user_id,
                   customer_name, customer_email, start_date, end_date,
                   total_amount, currency, payment_method, payment_status, status, metadata
                 ) VALUES (
                   left('${NS}_${label}', 50), 'accommodation', $acid::int, 'c36cn unit', $UID1::int,
                   'C36CN Tester', 'c36cn@example.invalid',
                   now(), now() + interval '2 days',
                   '1000.00', 'BRL', 'pix', 'paid', 'confirmed',
                   jsonb_build_object('c36cn', true, 'ns', '${NS}', 'case', '${label}')
                 ) RETURNING id::text;")"
              pay=$(trim_id "$($COMPOSE exec -T postgres psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -Atc \
                "INSERT INTO payments (
                   id, enterprise_id, provider, method, status, amount, currency,
                   booking_id, paid_at, metadata, created_at, updated_at
                 ) VALUES (
                   gen_random_uuid(), '$ENT'::uuid, 'mercadopago', 'pix', 'approved', '1000.00', 'BRL',
                   $bid::int, now(),
                   jsonb_build_object('c36cn', true, 'ns', '${NS}', 'case', '${label}'),
                   now(), now()
                 ) RETURNING id::text;")"
              echo "$bid $pay"
            }

            echo "=== SEED A (1 owner + terms) ==="
            read -r EID_A ACO_A HOTEL_A <<< "$(seed_emp_aco a)"
            PID_A=$(seed_partner "${NS}_pa")
            PEA_A=$(seed_pea "$PID_A" "$EID_A" "commercial_owner")
            $COMPOSE exec -T postgres psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -v ON_ERROR_STOP=1 -c \
              "INSERT INTO partner_commercial_terms (pea_id, rate_kind, rate_bps, basis, status, version)
               VALUES ('$PEA_A'::uuid, 'percent_bps', 1500, 'booking_total', 'active', 1);"
            read -r BID_A PAY_A <<< "$(seed_booking_payment "$ACO_A" a)"
            echo "A eid=$EID_A pea=$PEA_A pay=$PAY_A"

            echo "=== SEED C (agency only → no owner) ==="
            read -r EID_C ACO_C HOTEL_C <<< "$(seed_emp_aco c)"
            PID_C=$(seed_partner "${NS}_pc")
            seed_pea "$PID_C" "$EID_C" "agency" >/dev/null
            read -r BID_C PAY_C <<< "$(seed_booking_payment "$ACO_C" c)"

            echo "=== SEED D (two commercial_owners) ==="
            read -r EID_D ACO_D HOTEL_D <<< "$(seed_emp_aco d)"
            PID_D1=$(seed_partner "${NS}_pd1")
            PID_D2=$(seed_partner "${NS}_pd2")
            seed_pea "$PID_D1" "$EID_D" "commercial_owner" >/dev/null
            seed_pea "$PID_D2" "$EID_D" "commercial_owner" >/dev/null
            read -r BID_D PAY_D <<< "$(seed_booking_payment "$ACO_D" d)"

            echo "=== SEED E (owner without terms) ==="
            read -r EID_E ACO_E HOTEL_E <<< "$(seed_emp_aco e)"
            PID_E=$(seed_partner "${NS}_pe")
            seed_pea "$PID_E" "$EID_E" "commercial_owner" >/dev/null
            read -r BID_E PAY_E <<< "$(seed_booking_payment "$ACO_E" e)"

            echo "=== RUN PROBE (tsx) ==="
            $COMPOSE exec -T \
              -e C36CN_NS="$NS" \
              -e C36CN_PAYMENT_A="$PAY_A" \
              -e C36CN_PAYMENT_C="$PAY_C" \
              -e C36CN_PAYMENT_D="$PAY_D" \
              -e C36CN_PAYMENT_E="$PAY_E" \
              backend \
              npx tsx /workspace/backend/scripts/c36cn-earning-probe.ts

            echo "=== CLEANUP ==="
            $COMPOSE exec -T postgres psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -v ON_ERROR_STOP=1 <<SQL
            DELETE FROM partner_earnings pe
             USING payments p
             WHERE pe.source_id = p.id::text AND p.metadata->>'ns' = '${NS}';
            DELETE FROM payments WHERE metadata->>'ns' = '${NS}';
            DELETE FROM bookings WHERE metadata->>'ns' = '${NS}';
            DELETE FROM partner_commercial_terms pct
             USING partner_empreendimento_associations pea
             WHERE pct.pea_id = pea.id AND pea.metadata->>'ns' = '${NS}';
            DELETE FROM partner_empreendimento_associations WHERE metadata->>'ns' = '${NS}';
            DELETE FROM partners WHERE metadata->>'ns' = '${NS}';
            DELETE FROM acomodacoes WHERE hotel_id LIKE '${NS}-h-%';
            DELETE FROM empreendimentos WHERE metadata->>'ns' = '${NS}';
            DELETE FROM users WHERE email = '${NS}@example.invalid';
SQL

            LEFT=$(trim_id "$($COMPOSE exec -T postgres psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -Atc \
              "SELECT (SELECT COUNT(*) FROM partners WHERE metadata->>'ns'='${NS}')
                    + (SELECT COUNT(*) FROM empreendimentos WHERE metadata->>'ns'='${NS}')
                    + (SELECT COUNT(*) FROM payments WHERE metadata->>'ns'='${NS}');")")
            test "$LEFT" = "0"
            echo "C36-CN VALIDATE = SUCCESS residual=0"
