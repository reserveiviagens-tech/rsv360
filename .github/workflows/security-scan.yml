name: "Security Scan"

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
      - 'CODEOWNERS'
      - 'docs/**'
      - 'AGENTS.md'
      - '.github/copilot-instructions.md'
      - '.github/dependabot.yml'
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 6 AM UTC

permissions:
  contents: read
  security-events: write

jobs:
  npm-audit:
    name: NPM Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        lfs: false

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'npm'

    - name: Enable Corepack
      run: |
        corepack enable
        corepack prepare npm@10.9.7 --activate

    - name: Validate lockfiles
      run: bash .github/scripts/check-lockfiles.sh . backend

    - name: Install dependencies (root)
      run: npm ci

    - name: NPM Audit (root)
      run: |
          npm audit --omit=dev --json > /tmp/audit-root.json 2>/dev/null || true
          python3 .github/scripts/audit-gate.py /tmp/audit-root.json .github/audit-allowlist.json

    - name: Enable Corepack (backend)
      run: |
        corepack enable
        corepack prepare npm@10.9.7 --activate

    - name: Install dependencies (backend)
      working-directory: ./backend
      run: npm ci

    - name: NPM Audit (backend)
      working-directory: ./backend
      run: |
          npm audit --omit=dev --json > /tmp/audit-backend.json 2>/dev/null || true
          python3 ../.github/scripts/audit-gate.py /tmp/audit-backend.json ../.github/audit-allowlist.json

    - name: NPM Audit (frontend)
      run: |
          npm audit --omit=dev --workspace=apps/site-publico --json > /tmp/audit-front.json 2>/dev/null || true
          python3 .github/scripts/audit-gate.py /tmp/audit-front.json .github/audit-allowlist.json

  trivy-scan:
    name: Trivy Scan Backend Image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        lfs: false

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build backend Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./backend/Dockerfile
        push: false
        load: true
        tags: rsv360-backend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'image'
        scan-ref: 'rsv360-backend:latest'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v4
      continue-on-error: true
      if: always() && hashFiles('trivy-results.sarif') != ''
      with:
        sarif_file: 'trivy-results.sarif'
