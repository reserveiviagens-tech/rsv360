name: CD - Staging Deployment

on:
  push:
    branches: [ develop ]
  workflow_run:
    workflows: ["RSV360 CI Pipeline"]
    branches: [ develop ]
    types: [ completed ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' }}
    timeout-minutes: 30

    environment:
      name: staging
      url: https://staging.yourdomain.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare npm@10.9.7 --activate

      - name: Validate lockfiles
        run: bash .github/scripts/check-lockfiles.sh . backend

      - name: Generate deployment metadata
        id: meta
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "timestamp=$(date +%Y%m%d_%H%M%S)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for backend
        id: backend-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend
          tags: |
            type=raw,value=staging
            type=raw,value={{sha}}
            type=raw,value={{sha}}-staging

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/backend/Dockerfile
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=staging

      - name: Extract metadata for frontend
        id: frontend-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend
          tags: |
            type=raw,value=staging
            type=raw,value={{sha}}
            type=raw,value={{sha}}-staging

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/frontend/Dockerfile
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=staging

      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT || 22 }}
          script: |
            # Navigate to project directory
            cd ${{ secrets.STAGING_PATH }}

            # Backup current deployment
            echo "Creating backup of current deployment..."
            mkdir -p backups
            cp -r docker-compose.staging.yml backups/docker-compose.staging.yml.$(date +%Y%m%d_%H%M%S)

            # Update docker-compose.staging.yml with new image tags
            sed -i 's|image: .*backend.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:staging|g' docker-compose.staging.yml
            sed -i 's|image: .*frontend.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:staging|g' docker-compose.staging.yml

            # Login to GitHub Container Registry
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

            # Pull new images
            docker-compose -f docker-compose.staging.yml pull

            # Deploy with zero-downtime
            docker-compose -f docker-compose.staging.yml up -d --scale backend=1

            # Wait for health checks
            echo "Waiting for services to be healthy..."
            sleep 30

            # Health check validation
            if curl -f --max-time 30 http://${{ secrets.STAGING_HOST }}:8080/health; then
              echo "✅ Staging deployment successful!"
              echo "🌐 Application available at: https://staging.yourdomain.com"

              # Cleanup old images
              docker image prune -f
            else
              echo "❌ Health check failed! Rolling back..."

              # Rollback
              docker-compose -f docker-compose.staging.yml down
              cp backups/docker-compose.staging.yml.* docker-compose.staging.yml 2>/dev/null || true
              docker-compose -f docker-compose.staging.yml up -d

              exit 1
            fi

      - name: Notify deployment success
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: success
          text: "✅ Staging deployment successful - ${{ github.sha }} - https://staging.yourdomain.com"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

      - name: Notify deployment failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: "❌ Staging deployment failed - ${{ github.sha }}"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
