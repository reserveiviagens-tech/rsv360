name: CI

on:
  push:
    branches: [main, develop, upgrade/*]
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
      - 'CODEOWNERS'
      - 'docs/**'
      - 'AGENTS.md'
      - '.github/copilot-instructions.md'
      - '.github/dependabot.yml'

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: rsv360_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare npm@10.9.7 --activate

      - name: Validate lockfiles
        run: bash .github/scripts/check-lockfiles.sh . backend

      - name: Install dependencies
        run: npm ci

      - name: Validate Drizzle journal consistency
        run: cd backend && npm run db:validate-journal

      - name: Reject UTF-8 BOM in Drizzle SQL
        run: bash .github/scripts/check-sql-bom.sh backend/drizzle

      - name: Run database migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rsv360_test
        run: npm run migrate

      - name: Run backend tests (coverage)
        run: npm run test:ci --workspace=backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rsv360_test
          JWT_SECRET: ci_jwt_secret_minimum_32_chars
          NODE_ENV: test
          MP_ACCESS_TOKEN: test-token

  frontend-typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare npm@10.9.7 --activate

      - name: Validate lockfiles
        run: bash .github/scripts/check-lockfiles.sh . backend

      - name: Install dependencies
        run: npm ci

      - name: Type check (workspaces)
        run: npm run type-check --workspaces --if-present

  turismo-eslint-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: |
          corepack enable
          corepack prepare npm@10.9.7 --activate
      - run: npm ci
      - name: ESLint turismo baseline 0
        run: |
          out=$(node apps/turismo/scripts/eslint-warnings-rank.cjs)
          echo "$out"
          echo "$out" | grep -q "Total warnings (excl voucher-editor + validation): 0"

  monorepo-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: |
          corepack enable
          corepack prepare npm@10.9.7 --activate
      - run: npm ci
      - run: npm run build
  backend-typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare npm@10.9.7 --activate

      - name: Validate lockfiles
        run: bash .github/scripts/check-lockfiles.sh . backend

      - name: Install dependencies
        run: npm ci

      - name: Type check (backend)
        run: cd backend && npx tsc --noEmit
