name: CI

on:
  push:
    branches: [main, develop, upgrade/*]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: rsv360_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare npm@10.9.7 --activate

      - name: Validate lockfiles
        run: bash .github/scripts/check-lockfiles.sh . backend

      - name: Install dependencies
        run: npm ci

      - name: Validate Drizzle journal consistency
        run: cd backend && npm run db:validate-journal

      - name: Reject UTF-8 BOM in Drizzle SQL
        run: bash .github/scripts/check-sql-bom.sh backend/drizzle

      - name: Run database migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rsv360_test
        run: npm run migrate

      - name: Run backend tests (coverage)
        run: npm run test:ci --workspace=backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rsv360_test
          JWT_SECRET: ci_jwt_secret_minimum_32_chars
          NODE_ENV: test
          MP_ACCESS_TOKEN: test-token

  frontend-typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare npm@10.9.7 --activate

      - name: Validate lockfiles
        run: bash .github/scripts/check-lockfiles.sh . backend

      - name: Install dependencies
        run: npm ci

      - name: Type check (workspaces)
        run: npm run type-check --workspaces --if-present

  turismo-eslint-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: |
          corepack enable
          corepack prepare npm@10.9.7 --activate
      - run: npm ci
      - name: ESLint turismo baseline 0
        run: |
          out=$(node apps/turismo/scripts/eslint-warnings-rank.cjs)
          echo "$out"
          echo "$out" | grep -q "Total warnings (excl voucher-editor + validation): 0"

  monorepo-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: |
          corepack enable
          corepack prepare npm@10.9.7 --activate
      - run: npm ci
      - run: npm run build
  backend-typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: false
          fetch-depth: 0

      - name: Detect backend-relevant changes
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          relevant=false
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            # push/other: keep full type-check (unchanged push semantics)
            relevant=true
          else
            base='${{ github.event.pull_request.base.sha }}'
            head='${{ github.event.pull_request.head.sha }}'
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                backend/*|server/*|packages/shared/*|package.json|package-lock.json|.github/workflows/ci.yml|.github/scripts/*)
                  relevant=true
                  break
                  ;;
              esac
            done < <(git diff --name-only "${base}...${head}")
          fi
          echo "backend_relevant=${relevant}" >> "$GITHUB_OUTPUT"
          echo "backend_relevant=${relevant}"

      - name: Skip heavy type-check (no backend-relevant inputs)
        if: steps.filter.outputs.backend_relevant != 'true'
        run: |
          echo "No backend-relevant paths changed in this PR."
          echo "Skipping lockfile validation, npm ci, and tsc."
          echo "backend-typecheck: Success (no backend-relevant inputs)."

      - name: Setup Node.js
        if: steps.filter.outputs.backend_relevant == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Enable Corepack
        if: steps.filter.outputs.backend_relevant == 'true'
        run: |
          corepack enable
          corepack prepare npm@10.9.7 --activate

      - name: Validate lockfiles
        if: steps.filter.outputs.backend_relevant == 'true'
        run: bash .github/scripts/check-lockfiles.sh . backend

      - name: Install dependencies
        if: steps.filter.outputs.backend_relevant == 'true'
        run: npm ci

      - name: Type check (backend)
        if: steps.filter.outputs.backend_relevant == 'true'
        run: cd backend && npx tsc --noEmit
