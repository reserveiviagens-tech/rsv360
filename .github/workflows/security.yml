# HIG-01 — CodeQL Advanced Setup (custom workflow).
#
# Two different PR checks appear with similar names:
# 1) Actions job "Analyze (javascript-typescript)" — this workflow (~minutes). PASS = analysis ran.
# 2) App check "CodeQL" from github-advanced-security (~5-7s) — FAIL when the PR introduces
#    NEW code-scanning alerts; SUCCESS when title is "No new alerts...". Not a second workflow.
#
# Default Code Scanning setup is NOT configured on this repo; do not re-enable it alongside
# this advanced workflow (would duplicate analysis).
#
# See docs/evidence/hig-01/README.md
name: "CodeQL Analysis"

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
      - 'CODEOWNERS'
      - 'docs/**'
      - 'AGENTS.md'
      - '.github/copilot-instructions.md'
      - '.github/dependabot.yml'
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 6 AM UTC

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript-typescript' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        lfs: false

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4.37.4
      with:
        languages: ${{ matrix.language }}
        build-mode: none
        config-file: ./.github/codeql-config.yml

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4.37.4
      with:
        category: "/language:${{matrix.language}}"
