name: Deploy S1 CRM (Vite :5000)

# Atualiza o site oficial www (Crm-RSV-360 em :5000) na VPS.
# Usa STAGING_* (SSH real). PRODUCTION_* ainda está com placeholder.
on:
  workflow_dispatch:
    inputs:
      discover_only:
        description: 'Só inspecionar caminhos/processos (não deploy)'
        required: true
        type: boolean
        default: true
      git_ref:
        description: 'Branch/tag do Crm-RSV-360'
        required: true
        type: string
        default: main

jobs:
  deploy-s1:
    name: Deploy S1 CRM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    steps:
      - name: Discover / Deploy CRM on :5000
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT || 22 }}
          command_timeout: 25m
          script: |
            set -uo pipefail
            echo "=== Listeners :5000 / :8081 / :3000 ==="
            (ss -tlnp 2>/dev/null || netstat -tlnp 2>/dev/null || true) | grep -E ':(5000|8081|3000)\b' || true

            echo "=== Candidate CRM dirs ==="
            for d in \
              "$HOME/crm-rsv-360" \
              "$HOME/Crm-RSV-360" \
              "$HOME/apps/Crm-RSV-360" \
              "/opt/Crm-RSV-360" \
              "/var/www/Crm-RSV-360" \
              "/home/rsvadmin/crm-rsv-360" \
              "/home/rsvadmin/Crm-RSV-360"; do
              if [ -d "$d" ] && [ -f "$d/package.json" ]; then
                echo "FOUND $d"
                (cd "$d" && git rev-parse --abbrev-ref HEAD 2>/dev/null; git log -1 --oneline 2>/dev/null) || true
              fi
            done

            echo "=== pm2 / systemd / docker ==="
            (command -v pm2 >/dev/null && pm2 list) || echo "pm2 not installed"
            systemctl list-units --type=service --all 2>/dev/null | grep -iE 'crm|rsv|s1|express' || true
            docker ps --format '{{.Names}} {{.Ports}}' 2>/dev/null | grep -E '5000|crm|s1' || true

            if [ "${{ inputs.discover_only }}" = "true" ]; then
              echo "Discover-only — done"
              exit 0
            fi

            set -e
            CRM_DIR=""
            for d in \
              "${CRM_PATH:-}" \
              "$HOME/crm-rsv-360" \
              "$HOME/Crm-RSV-360" \
              "/opt/Crm-RSV-360" \
              "/var/www/Crm-RSV-360" \
              "/home/rsvadmin/crm-rsv-360" \
              "/home/rsvadmin/Crm-RSV-360"; do
              if [ -n "${d:-}" ] && [ -f "$d/package.json" ]; then
                CRM_DIR="$d"
                break
              fi
            done

            if [ -z "$CRM_DIR" ]; then
              echo "ERROR: Crm-RSV-360 directory not found"
              exit 1
            fi

            echo "=== Deploy $CRM_DIR @ ${{ inputs.git_ref }} ==="
            cd "$CRM_DIR"

            if [ -d .git ]; then
              git fetch --all --prune
              git checkout "${{ inputs.git_ref }}"
              git pull --ff-only origin "${{ inputs.git_ref }}" || git reset --hard "origin/${{ inputs.git_ref }}"
            else
              echo "WARN: sem .git — pulando git pull"
            fi

            if [ -f package-lock.json ]; then
              npm ci --ignore-scripts || npm install --ignore-scripts
            else
              npm install --ignore-scripts
            fi
            npm run build

            if command -v pm2 >/dev/null 2>&1 && pm2 describe crm-rsv-360 >/dev/null 2>&1; then
              pm2 restart crm-rsv-360 --update-env
            elif command -v pm2 >/dev/null 2>&1 && pm2 describe s1 >/dev/null 2>&1; then
              pm2 restart s1 --update-env
            elif systemctl is-active --quiet crm-rsv-360 2>/dev/null; then
              sudo systemctl restart crm-rsv-360
            elif docker ps --format '{{.Names}}' | grep -qiE 'crm|s1|rsv360-crm'; then
              CTR=$(docker ps --format '{{.Names}}' | grep -iE 'crm|s1|rsv360-crm' | head -1)
              docker restart "$CTR"
            else
              # Porta 5000 pode ser docker-proxy — tentar restart do container que publica 5000
              CTR=$(docker ps --format '{{.Names}} {{.Ports}}' | awk '/:5000->|:5000\b/ {print $1; exit}')
              if [ -n "${CTR:-}" ]; then
                echo "Restarting docker container $CTR (publishes :5000)"
                docker restart "$CTR"
              else
                PID=$(ss -tlnp 2>/dev/null | awk '/:5000/ {print}' | sed -n 's/.*pid=\([0-9]*\).*/\1/p' | head -1 || true)
                if [ -n "${PID:-}" ]; then
                  kill "$PID" || true
                  sleep 2
                fi
                nohup npm run start > /tmp/crm-rsv-360.log 2>&1 &
                echo "Started via nohup pid $!"
              fi
            fi

            sleep 10
            curl -fsS --max-time 25 "http://127.0.0.1:5000/" >/dev/null
            echo "OK S1 CRM healthy on :5000"
