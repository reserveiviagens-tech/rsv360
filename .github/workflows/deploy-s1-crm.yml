name: Deploy S1 CRM (Vite :5000)

# www.reserveiviagens.com.br → container Docker crm-rsv-360-s1 (:5000)
on:
  workflow_dispatch:
    inputs:
      discover_only:
        description: 'Só inspecionar (não deploy)'
        required: true
        type: boolean
        default: false
      git_ref:
        description: 'Branch/tag do Crm-RSV-360'
        required: true
        type: string
        default: main

jobs:
  deploy-s1:
    name: Deploy S1 CRM
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    steps:
      - name: Discover / Deploy CRM Docker :5000
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT || 22 }}
          command_timeout: 40m
          script: |
            set -uo pipefail
            echo "=== docker crm / :5000 ==="
            docker ps -a --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}' | head -30
            echo "--- inspect crm-rsv-360-s1 ---"
            docker inspect crm-rsv-360-s1 --format 'Image={{.Config.Image}} WorkDir={{.Config.WorkingDir}}' 2>/dev/null || true
            docker inspect crm-rsv-360-s1 --format '{{range $k,$v := .Config.Labels}}{{$k}}={{$v}}{{println}}{{end}}' 2>/dev/null | head -40 || true
            echo "=== home crm dir ==="
            ls -la "$HOME/crm-rsv-360" 2>/dev/null | head -50 || true
            find "$HOME" -maxdepth 3 -type f \( -name 'docker-compose*.yml' -o -name 'Dockerfile' \) 2>/dev/null | head -40 || true

            if [ "${{ inputs.discover_only }}" = "true" ]; then
              echo "Discover-only — done"
              exit 0
            fi

            set -e
            WORK="$HOME/crm-rsv-360"
            REF="${{ inputs.git_ref }}"
            TS=$(date +%Y%m%d%H%M%S)

            # Snapshot env from running container
            ENV_FILE="/tmp/crm-s1-env.$TS"
            docker inspect crm-rsv-360-s1 --format '{{range .Config.Env}}{{println .}}{{end}}' > "$ENV_FILE"
            NET=$(docker inspect crm-rsv-360-s1 --format '{{range $k,$v := .NetworkSettings.Networks}}{{println $k}}{{end}}' 2>/dev/null | head -1)
            echo "Network=$NET"

            # Fresh clone alongside (keep bak of previous tree)
            if [ -d "$WORK" ] && [ ! -d "$WORK/.git" ]; then
              mv "$WORK" "${WORK}.bak.$TS"
            fi
            if [ -d "$WORK/.git" ]; then
              cd "$WORK"
              git fetch --all --prune
              git checkout "$REF"
              git reset --hard "origin/$REF"
            else
              git clone --depth 1 --branch "$REF" \
                https://github.com/reserveiviagens-tech/Crm-RSV-360.git "$WORK"
              cd "$WORK"
            fi
            echo "HEAD=$(git log -1 --oneline)"

            # Build image
            if [ -f Dockerfile ]; then
              docker build -t crm-rsv-360-s1:latest .
            else
              cat > /tmp/Dockerfile.crm-s1 <<'DOCKER'
            FROM node:20-bookworm-slim
            WORKDIR /app
            COPY package.json package-lock.json* ./
            RUN npm ci --ignore-scripts || npm install --ignore-scripts
            COPY . .
            RUN npm run build
            ENV NODE_ENV=production
            ENV PORT=5000
            EXPOSE 5000
            CMD ["npm", "run", "start"]
            DOCKER
              # Fix: heredoc above got indented by YAML — write without indent via printf
              python3 - <<'PY'
            from pathlib import Path
            Path("/tmp/Dockerfile.crm-s1").write_text("""FROM node:20-bookworm-slim
            WORKDIR /app
            COPY package.json package-lock.json* ./
            RUN npm ci --ignore-scripts || npm install --ignore-scripts
            COPY . .
            RUN npm run build
            ENV NODE_ENV=production
            ENV PORT=5000
            EXPOSE 5000
            CMD [\"npm\", \"run\", \"start\"]
            """.replace("            ", ""))
            PY
              docker build -f /tmp/Dockerfile.crm-s1 -t crm-rsv-360-s1:latest .
            fi

            docker stop crm-rsv-360-s1 || true
            docker rm crm-rsv-360-s1 || true
            RUN_ARGS=(-d --name crm-rsv-360-s1 --restart unless-stopped -p 5000:5000 --env-file "$ENV_FILE")
            if [ -n "${NET:-}" ]; then RUN_ARGS+=(--network "$NET"); fi
            docker run "${RUN_ARGS[@]}" crm-rsv-360-s1:latest

            sleep 15
            curl -fsS --max-time 30 "http://127.0.0.1:5000/" >/dev/null
            echo "OK S1 CRM healthy on :5000 (ref=$REF)"
