name: Deploy S1 CRM (Vite :5000)

# www.reserveiviagens.com.br → Docker service s1 (crm-rsv-360-s1) na VPS :5000
# Fonte: ~/crm-rsv-360/docker-compose.yml (compose project crm-rsv-360)
on:
  workflow_dispatch:
    inputs:
      discover_only:
        description: 'Só inspecionar (não deploy)'
        required: true
        type: boolean
        default: false
      git_ref:
        description: 'Branch/tag do Crm-RSV-360'
        required: true
        type: string
        default: main

jobs:
  deploy-s1:
    name: Deploy S1 CRM
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    steps:
      - name: Deploy CRM Docker compose s1
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT || 22 }}
          command_timeout: 40m
          script: |
            set -uo pipefail
            CRM_DIR="$HOME/crm-rsv-360"
            REF="${{ inputs.git_ref }}"
            echo "=== before ==="
            docker ps --filter name=crm-rsv-360-s1 --format '{{.Names}} {{.Image}} {{.Status}}'
            ls -la "$CRM_DIR" | head -20

            if [ "${{ inputs.discover_only }}" = "true" ]; then
              docker inspect crm-rsv-360-s1 --format 'Image={{.Config.Image}}' || true
              cat "$CRM_DIR/docker-compose.yml" || true
              echo "Discover-only — done"
              exit 0
            fi

            set -e
            test -f "$CRM_DIR/docker-compose.yml"
            cd "$CRM_DIR"

            # Preserve local compose + env; refresh app source from GitHub
            TS=$(date +%Y%m%d%H%M%S)
            SRC="/tmp/Crm-RSV-360-$TS"
            rm -rf "$SRC"
            git clone --depth 1 --branch "$REF" \
              https://github.com/reserveiviagens-tech/Crm-RSV-360.git "$SRC"
            echo "Cloned $(cd "$SRC" && git log -1 --oneline)"

            # Sync code (keep runtime/config files on server)
            # Preserva Dockerfile/compose/.env do servidor (repo CRM não tem Dockerfile)
            rsync -a --delete \
              --exclude '.env' \
              --exclude '.env.*' \
              --exclude 'docker-compose.yml' \
              --exclude 'docker-compose.yaml' \
              --exclude 'Dockerfile' \
              --exclude 'Dockerfile.*' \
              --exclude 'node_modules' \
              --exclude '.git' \
              --exclude 'dist' \
              --exclude 'uploads' \
              --exclude 'data' \
              "$SRC"/ "$CRM_DIR"/

            rm -rf "$SRC"

            echo "=== docker compose build/up s1 ==="
            docker compose build --pull s1
            docker compose up -d --force-recreate s1

            sleep 15
            docker ps --filter name=crm-rsv-360-s1 --format '{{.Names}} {{.Image}} {{.Status}}'
            curl -fsS --max-time 30 "http://127.0.0.1:5000/" >/dev/null
            echo "OK www/:5000 healthy after deploy ref=$REF"
