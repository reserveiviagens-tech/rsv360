name: E2E Infra Smoke

on:
  push:
    branches: [main, develop, feature/*]
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
      - 'CODEOWNERS'
      - 'docs/**'
      - 'AGENTS.md'
      - '.github/copilot-instructions.md'
      - '.github/dependabot.yml'

jobs:
  infra-smoke:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: rsv360_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare npm@10.9.7 --activate

      - name: Validate lockfiles
        run: bash .github/scripts/check-lockfiles.sh . backend

      - name: Install dependencies
        run: npm ci

      - name: Run E2E infra smoke
        run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rsv360_test
          MP_ACCESS_TOKEN: test-token
          NODE_ENV: test
          REDIS_DISABLED: 'true'
          # PR-04a fail-closed: boot exige JWT_SECRET. Placeholder de CI (>=32), nao secret real.
          JWT_SECRET: ci_fase5_jwt_secret_minimum_32_chars
          # PR-05b fail-closed: /metrics exige Bearer. Secret do repo (nunca logar o valor).
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
