x-app-env: &app-env
  NEXT_PUBLIC_API_URL: http://localhost:3002
  NEXT_PUBLIC_BACKEND_URL: http://localhost:3002
  INTERNAL_API_URL: http://backend:3002
  # GATE-PROD-01 — mock contract/signature UIs (default false = prod-safe)
  NEXT_PUBLIC_ENABLE_CONTRATOS_MOCK: ${NEXT_PUBLIC_ENABLE_CONTRATOS_MOCK:-false}
  # Cloudflare always-pass site key is public (docs); secret must come from host env (PR-09b).
  NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-1x00000000000000000000AA}
  TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
  # PR-04a: fail-closed — no default. JWT_REFRESH_SECRET optional (inherits JWT_SECRET in code).
  JWT_SECRET: ${JWT_SECRET}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-}
  # PR-05b: explicit CORS (localhost + 127.0.0.1 × 3000/3001/3004/3005/3006) — never rely on code default alone in compose.
  CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:3001,http://localhost:3004,http://localhost:3005,http://localhost:3006,http://127.0.0.1:3000,http://127.0.0.1:3001,http://127.0.0.1:3004,http://127.0.0.1:3005,http://127.0.0.1:3006}
  # PR-05b: Prometheus scrape bearer (required for /metrics and /api/metrics).
  METRICS_TOKEN: ${METRICS_TOKEN}

# Rede unificada (#250) — todos os servicos na mesma rede (sem network connect manual)
networks:
  rsv360_net:
    name: rsv360_internal
    driver: bridge

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ${RSV360_DOCKER_PROJECT:-rsv360}-postgres
    networks:
      - rsv360_net
    restart: unless-stopped
    ports:
      # 5433 no host evita conflito com PostgreSQL local (Windows) na 5432
      # PR-09b: bind localhost only (not 0.0.0.0)
      - '127.0.0.1:5433:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - rsv360_pgdata:/var/lib/postgresql/data
      - ./database/g4-auth-smoke-tables.sql:/docker-entrypoint-initdb.d/99-g4-auth-smoke-tables.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rsv360 -d rsv_360_ecosystem']
      interval: 10s
      timeout: 5s
      retries: 8

  redis:
    image: redis:7-alpine
    container_name: ${RSV360_DOCKER_PROJECT:-rsv360}-redis
    networks:
      - rsv360_net
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      # PR-09b: bind localhost only (not 0.0.0.0)
      - '127.0.0.1:6379:6379'
    volumes:
      - rsv360_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ${RSV360_DOCKER_PROJECT:-rsv360}-backend
    networks:
      - rsv360_net
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '3002:3002'
    environment:
      PORT: 3002
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      TRUST_PROXY: ${TRUST_PROXY:-loopback}
      JWT_SECRET: ${JWT_SECRET}
      # PR-09b: fail-closed — no hardcoded test-token / placeholder secrets
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN}
      META_PIXEL_ID: ${META_PIXEL_ID:-}
      META_CAPI_ACCESS_TOKEN: ${META_CAPI_ACCESS_TOKEN:-}
      TIKTOK_PIXEL_ID: ${TIKTOK_PIXEL_ID:-}
      TIKTOK_ACCESS_TOKEN: ${TIKTOK_ACCESS_TOKEN:-}
      PASSWORD_RESET_BASE_URL: ${PASSWORD_RESET_BASE_URL:-http://localhost:3000}
      PASSWORD_RESET_EMAIL_WEBHOOK: ${PASSWORD_RESET_EMAIL_WEBHOOK:-}
      FORNECEDORES_ENCRYPTION_KEY: ${FORNECEDORES_ENCRYPTION_KEY:-}
      FORNECEDORES_ALLOW_PLAINTEXT_API_KEY: ${FORNECEDORES_ALLOW_PLAINTEXT_API_KEY:-false}
      PASSWORD_RESET_EMAIL_WEBHOOK_SECRET: ${PASSWORD_RESET_EMAIL_WEBHOOK_SECRET:-}
      PASSWORD_RESET_EMAIL_FROM: ${PASSWORD_RESET_EMAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      # Optional SMS (co-host invites) — set on host .env; never commit values
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      OAUTH_BFF_SECRET: ${OAUTH_BFF_SECRET}
      SSO_BFF_SECRET: ${SSO_BFF_SECRET:-${OAUTH_BFF_SECRET}}
      MARKETING_LAB_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      QR_SECRET: ${QR_SECRET}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
      # PR-06c / F5 — flags default OFF (owner activation via .env host)
      AUTH_LOGIN_PROTECTION_ENABLED: ${AUTH_LOGIN_PROTECTION_ENABLED:-false}
      AUTH_MFA_ENFORCE: ${AUTH_MFA_ENFORCE:-false}
      AUTH_MFA_ENROLLMENT_START_AT: ${AUTH_MFA_ENROLLMENT_START_AT:-}
      AUTH_MFA_ENROLLMENT_WINDOW_HOURS: ${AUTH_MFA_ENROLLMENT_WINDOW_HOURS:-72}
      AUTH_LOGIN_TURNSTILE_FAIL_CLOSED: ${AUTH_LOGIN_TURNSTILE_FAIL_CLOSED:-}
      # Agentes / Instrutor (F2c-3) — opcional; T1 fail-safe se ausente. Nunca commitar o valor.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # PR-05b
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:3001,http://localhost:3004,http://localhost:3005,http://localhost:3006,http://127.0.0.1:3000,http://127.0.0.1:3001,http://127.0.0.1:3004,http://127.0.0.1:3005,http://127.0.0.1:3006}
      METRICS_TOKEN: ${METRICS_TOKEN}
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:3002/health || exit 1']
      interval: 20s
      timeout: 8s
      retries: 5
    volumes:
      - uploads_hoteis:/workspace/backend/public/uploads

  admin:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        APP_DIR: apps/admin
        APP_PORT: 3004
        <<: *app-env
    container_name: ${RSV360_DOCKER_PROJECT:-rsv360}-admin
    networks:
      - rsv360_net
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '3004:3004'
    environment:
      <<: *app-env
      PORT: 3004

  guest:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        APP_DIR: apps/guest
        APP_PORT: 3006
        <<: *app-env
    container_name: ${RSV360_DOCKER_PROJECT:-rsv360}-guest
    networks:
      - rsv360_net
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '3006:3006'
    environment:
      <<: *app-env
      PORT: 3006

  site-publico:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        APP_DIR: apps/site-publico
        APP_PORT: 3000
        <<: *app-env
        NEXT_PUBLIC_APP_MODE: ${NEXT_PUBLIC_APP_MODE:-marketing-lab}
        NEXT_PUBLIC_PRIMARY_SITE_URL: ${NEXT_PUBLIC_PRIMARY_SITE_URL:-http://localhost:5000}
        NEXT_PUBLIC_LAB_TITLE: ${NEXT_PUBLIC_LAB_TITLE:-RSV360 Marketing Lab}
        RSV360_APP_MODE: ${RSV360_APP_MODE:-marketing-lab}
        MARKETING_LAB_REQUIRE_AUTH: ${MARKETING_LAB_REQUIRE_AUTH:-false}
    container_name: ${RSV360_DOCKER_PROJECT:-rsv360}-site-publico
    networks:
      - rsv360_net
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - '3000:3000'
    environment:
      <<: *app-env
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_ENABLED: 'true'
      BACKEND_INTERNAL_URL: http://backend:3002
      # F5 — MFA admin proxy (in-network). Prefer AUTH_V1_BASE_URL when set.
      AUTH_V1_BASE_URL: ${AUTH_V1_BASE_URL:-http://backend:3002}
      BACKEND_URL: ${BACKEND_URL:-http://backend:3002}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      AUTH_LOGIN_PROTECTION_ENABLED: ${AUTH_LOGIN_PROTECTION_ENABLED:-false}
      AUTH_MFA_ENFORCE: ${AUTH_MFA_ENFORCE:-false}
      AUTH_MFA_ENROLLMENT_START_AT: ${AUTH_MFA_ENROLLMENT_START_AT:-}
      AUTH_MFA_ENROLLMENT_WINDOW_HOURS: ${AUTH_MFA_ENROLLMENT_WINDOW_HOURS:-72}
      AUTH_LOGIN_TURNSTILE_FAIL_CLOSED: ${AUTH_LOGIN_TURNSTILE_FAIL_CLOSED:-}
      OAUTH_BFF_SECRET: ${OAUTH_BFF_SECRET}
      SSO_BFF_SECRET: ${SSO_BFF_SECRET:-${OAUTH_BFF_SECRET}}
      SSO_DEV_MOCK: ${SSO_DEV_MOCK:-true}
      MARKETING_LAB_REQUIRE_AUTH: ${MARKETING_LAB_REQUIRE_AUTH:-false}
      OAUTH_DEV_MOCK: ${OAUTH_DEV_MOCK:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      FACEBOOK_REDIRECT_URI: ${FACEBOOK_REDIRECT_URI:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      LAB_METRICS_DEMO: ${LAB_METRICS_DEMO:-true}
      RSV360_APP_MODE: ${RSV360_APP_MODE:-marketing-lab}
      NEXT_PUBLIC_APP_MODE: ${NEXT_PUBLIC_APP_MODE:-marketing-lab}
      NEXT_PUBLIC_PRIMARY_SITE_URL: ${NEXT_PUBLIC_PRIMARY_SITE_URL:-http://localhost:5000}
      NEXT_PUBLIC_LAB_TITLE: ${NEXT_PUBLIC_LAB_TITLE:-RSV360 Marketing Lab}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-1x00000000000000000000AA}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
      MERCADO_PAGO_WEBHOOK_SECRET: ${MERCADO_PAGO_WEBHOOK_SECRET:-}
      MERCADO_PAGO_ACCESS_TOKEN: ${MERCADO_PAGO_ACCESS_TOKEN:-}
      MERCADO_PAGO_API_BASE_URL: ${MERCADO_PAGO_API_BASE_URL:-}

  turismo:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        APP_DIR: apps/turismo
        APP_PORT: 3005
        <<: *app-env
    container_name: ${RSV360_DOCKER_PROJECT:-rsv360}-turismo
    networks:
      - rsv360_net
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '3005:3005'
    environment:
      <<: *app-env
      PORT: 3005
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 -O /dev/null http://127.0.0.1:3005/api/health || exit 1']
      interval: 20s
      timeout: 8s
      retries: 6
      start_period: 90s

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: ${RSV360_DOCKER_PROJECT:-rsv360}-prometheus
    networks:
      - rsv360_net
    restart: unless-stopped
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ -z "$$METRICS_TOKEN" ]; then
          echo "[prometheus] METRICS_TOKEN is required for scrape (PR-05b)" >&2
          exit 1
        fi
        printf '%s' "$$METRICS_TOKEN" > /tmp/metrics_bearer_token
        exec /bin/prometheus \
          --config.file=/etc/prometheus/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --web.enable-lifecycle
    ports:
      - '9090:9090'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      backend:
        condition: service_healthy
      alertmanager:
        condition: service_started
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:9090/-/healthy']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: ${RSV360_DOCKER_PROJECT:-rsv360}-alertmanager
    networks:
      - rsv360_net
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - '9093:9093'
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:9093/-/healthy']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  grafana:
    image: grafana/grafana-oss:11.1.5
    container_name: ${RSV360_DOCKER_PROJECT:-rsv360}-grafana
    networks:
      - rsv360_net
    restart: unless-stopped
    ports:
      - '3007:3000'
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  rsv360_pgdata:
    driver: local
  rsv360_redisdata:
    driver: local
  prometheus_data:
    driver: local
  alertmanager_data:
    driver: local
  grafana_data:
    driver: local
  uploads_hoteis:
    driver: local
